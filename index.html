<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlexZen — Meditations Change Your Lifestyle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="hero-wrap">

  <section class="hero">
    <img
      class="hero-img"
      id="heroImg"
      src="https://images.pexels.com/photos/1051838/pexels-photo-1051838.jpeg?auto=compress&cs=tinysrgb&w=1600"
      alt="Woman sitting in a meditative pose, eyes closed, hands resting in gyan mudra">
    <div class="hero-scrim"></div>

    <nav>
      <div class="logo">
        <span class="logo-mark">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C12 2 6 8 6 14C6 17.3137 8.68629 20 12 20C15.3137 20 18 17.3137 18 14C18 8 12 2 12 2Z" stroke="#f7f3ea" stroke-width="1.6"/>
          </svg>
        </span>
        FlexZen
      </div>
      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">Features</a></li>
        <li><a href="#">About Us</a></li>
        <li><a href="#">Trainers</a></li>
        <li><a href="#">Testimonials</a></li>
      </ul>
      <div class="nav-actions">
        <a href="#" class="link-login">Log In</a>
        <button class="btn-signup">
          Sign Up
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M7 17L17 7M17 7H8M17 7V16"/>
          </svg>
        </button>
      </div>
    </nav>

    <div class="hero-content">
      <div class="hero-text">
        <span class="eyebrow">Daily Fitness Guide</span>
        <h1>
          <span class="line"><span>Meditations <em>change</em></span></span>
          <span class="line"><span>your lifestyle</span></span>
        </h1>

        <div class="hero-cta-row">
          <button class="btn-primary" id="ctaBtn">
            Get in touch
            <span class="arrow-circle">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 17L17 7M17 7H8M17 7V16"/>
              </svg>
            </span>
          </button>
        </div>

        <div class="popular-tags">
          <span class="label">Popular Tags</span>
          <span class="tag-pill"><span class="dot"></span>New Fitness</span>
          <span class="tag-pill"><span class="dot"></span>Health Goal</span>
          <span class="tag-pill"><span class="dot"></span>Fit Goal</span>
        </div>
      </div>

      <div class="rating-card">
        <div class="rating-top">
          <div class="avatar-stack">
            <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=80&q=80" alt="">
            <img src="https://images.unsplash.com/photo-1633332755192-727a05c4013d?auto=format&fit=crop&w=80&q=80" alt="">
            <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=80&q=80" alt="">
          </div>
          <div class="trusted-label">
            <span class="more">500k+</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>
            Trusted
          </div>
        </div>
        <p class="rating-quote">The perfect organizer and developer for dream agency</p>
        <div class="rating-bottom">
          <div class="rating-number-wrap">
            <span class="breath-ring"></span>
            <span class="rating-number">4.9</span>
          </div>
          <div class="rating-meta">
            <div class="stars">
              <svg viewBox="0 0 20 20"><path d="M10 1l2.6 5.9L19 7.6l-4.8 4.3L15.5 19 10 15.4 4.5 19l1.3-7.1L1 7.6l6.4-.7L10 1z"/></svg>
              <svg viewBox="0 0 20 20"><path d="M10 1l2.6 5.9L19 7.6l-4.8 4.3L15.5 19 10 15.4 4.5 19l1.3-7.1L1 7.6l6.4-.7L10 1z"/></svg>
              <svg viewBox="0 0 20 20"><path d="M10 1l2.6 5.9L19 7.6l-4.8 4.3L15.5 19 10 15.4 4.5 19l1.3-7.1L1 7.6l6.4-.7L10 1z"/></svg>
              <svg viewBox="0 0 20 20"><path d="M10 1l2.6 5.9L19 7.6l-4.8 4.3L15.5 19 10 15.4 4.5 19l1.3-7.1L1 7.6l6.4-.7L10 1z"/></svg>
              <svg viewBox="0 0 20 20"><path d="M10 1l2.6 5.9L19 7.6l-4.8 4.3L15.5 19 10 15.4 4.5 19l1.3-7.1L1 7.6l6.4-.7L10 1z"/></svg>
            </div>
            <span class="rating-caption">Rating</span>
          </div>
        </div>
      </div>
    </div>
  </section>

</div>

<script src="index.js"></script>
</body>
</html>
